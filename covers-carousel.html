<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books & Publications — Shawn M. Klimek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0d12;
    --gold: #c8a84b;
    --gold-dim: #8a7030;
    --gold-glow: rgba(200,168,75,0.18);
    --cream: #e8e4d8;
    --pale: #c8c8e0;
    --silver: #9898b8;
    --panel: #1c1c28;
    --panel2: #14141e;
    --border: #2a2a3a;
    --muted: #4a4a6a;
    --thumb-w: 72px;
    --thumb-h: 96px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); color: var(--cream); font-family: 'Crimson Text', Georgia, serif; min-height: 100vh; overflow-x: hidden; }
  #stars-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55; }
  .page { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

  /* HEADER */
  header { padding: 2rem 2rem 1.2rem; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(to bottom, rgba(13,13,18,0.98), rgba(13,13,18,0.7)); }
  header .eyebrow { font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.3em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 0.4rem; }
  header h1 { font-family: 'Cinzel', serif; font-size: clamp(1.3rem, 4vw, 2.2rem); font-weight: 700; color: var(--gold); letter-spacing: 0.06em; }
  header .sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1rem; color: var(--silver); margin-top: 0.25rem; }
  .hint { text-align: center; font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.2em; color: var(--muted); padding: 0.6rem 1rem 0.4rem; text-transform: uppercase; }

  /* STRIP */
  .strip-outer { position: relative; background: var(--panel2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 1rem 0; user-select: none; cursor: grab; overflow: hidden; }
  .strip-outer.dragging { cursor: grabbing; }
  .strip-outer::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(to bottom, transparent, var(--gold), transparent); opacity: 0.4; pointer-events: none; z-index: 10; }
  .strip-outer::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, var(--panel2) 0%, transparent 10%, transparent 90%, var(--panel2) 100%); pointer-events: none; z-index: 5; }
  .strip-track { display: flex; align-items: center; gap: 10px; padding: 0 calc(50vw - var(--thumb-w)/2); width: max-content; will-change: transform; }

  /* THUMBNAILS */
  .thumb { flex-shrink: 0; width: var(--thumb-w); height: var(--thumb-h); position: relative; border-radius: 2px; overflow: hidden; border: 1.5px solid var(--border); transition: border-color 0.35s, box-shadow 0.35s, transform 0.35s, filter 0.35s; filter: brightness(0.6) saturate(0.5); transform-origin: center bottom; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .thumb.active { border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow), 0 0 6px rgba(200,168,75,0.45); filter: brightness(1) saturate(1); transform: scaleY(1.07) translateY(-3px); z-index: 2; }
  .thumb.near1 { filter: brightness(0.85) saturate(0.8); transform: scaleY(1.03) translateY(-1px); }
  .thumb.near2 { filter: brightness(0.72) saturate(0.65); }
  .thumb .oop-badge { position: absolute; bottom: 3px; right: 3px; background: rgba(13,13,18,0.8); color: var(--silver); font-family: 'Cinzel', serif; font-size: 0.36rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 4px; border-radius: 2px; border: 1px solid var(--muted); }
  .thumb .placeholder-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--panel); padding: 4px; font-family: 'Cinzel', serif; font-size: 0.42rem; color: var(--muted); text-align: center; letter-spacing: 0.06em; line-height: 1.3; word-break: break-word; }

  /* ARROWS */
  .arrow-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 20; background: rgba(13,13,18,0.8); border: 1px solid var(--border); color: var(--gold); width: 30px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; border-radius: 2px; transition: background 0.2s, border-color 0.2s; }
  .arrow-btn:hover { background: rgba(200,168,75,0.1); border-color: var(--gold); }
  .arrow-btn.left { left: 6px; }
  .arrow-btn.right { right: 6px; }

  /* DETAIL */
  .detail { flex: 1; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; gap: 0; padding: 1.8rem clamp(1rem, 5vw, 3.5rem); max-width: 1100px; margin: 0 auto; width: 100%; min-height: 380px; }
  .detail-empty { grid-column: 1/3; display: flex; align-items: center; justify-content: center; opacity: 0.35; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; color: var(--silver); }

  /* COVER */
  .detail-cover { grid-row: 1/3; grid-column: 1; align-self: start; margin-right: 2.6rem; }
  .detail-cover img { display: block; width: clamp(180px, 22vw, 300px); height: auto; border-radius: 3px; border: 1.5px solid var(--gold-dim); box-shadow: 0 0 60px rgba(200,168,75,0.14), 0 12px 48px rgba(0,0,0,0.8); transition: opacity 0.35s ease, transform 0.35s ease; }
  .detail-cover.fade img { opacity: 0; transform: scale(0.97); }

  /* META */
  .detail-meta { grid-row: 1; grid-column: 2; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .book-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 600; color: var(--gold); line-height: 1.2; margin-bottom: 0.6rem; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 0.3rem 1.4rem; margin-bottom: 0.7rem; }
  .meta-item { display: flex; flex-direction: column; gap: 0.05rem; }
  .meta-label { font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-dim); }
  .meta-val { font-size: 0.98rem; color: var(--pale); }
  .genre-tag { display: inline-block; font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--silver); border: 1px solid var(--muted); border-radius: 2px; padding: 2px 6px; margin-right: 4px; margin-bottom: 4px; }
  .btn-buy { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.7rem; padding: 0.4rem 1.1rem; background: transparent; border: 1.5px solid var(--gold); color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; border-radius: 2px; cursor: pointer; transition: background 0.2s, color 0.2s; }
  .btn-buy:hover { background: var(--gold); color: var(--ink); }
  .btn-buy.dim { border-color: var(--muted); color: var(--silver); opacity: 0.7; }
  .btn-buy.dim:hover { background: transparent; color: var(--silver); }

  /* CONTRIBUTIONS */
  .detail-contribs { grid-row: 2; grid-column: 2; padding-top: 1rem; }
  .contribs-label { font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 0.7rem; }
  .contribs-list { list-style: none; display: flex; flex-direction: column; gap: 0.28rem; max-height: 260px; overflow-y: auto; padding-right: 0.4rem; }
  .contribs-list::-webkit-scrollbar { width: 3px; }
  .contribs-list::-webkit-scrollbar-track { background: var(--panel); }
  .contribs-list::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
  .contribs-list li { display: flex; align-items: baseline; gap: 0.6rem; font-size: 0.97rem; color: var(--cream); line-height: 1.4; }
  .contribs-list li::before { content: '◆'; color: var(--gold-dim); font-size: 0.46rem; flex-shrink: 0; position: relative; top: -0.1em; }
  .contrib-type { font-family: 'Cinzel', serif; font-size: 0.52rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }

  /* FOOTER */
  footer { text-align: center; padding: 1.2rem; border-top: 1px solid var(--border); font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
  footer a { color: var(--gold-dim); text-decoration: none; }
  footer a:hover { color: var(--gold); }

  /* FILTER / SORT BAR */
  .filterbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 0.65rem clamp(0.8rem, 4vw, 2rem); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem 1.4rem; }
  .filterbar-group { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .filterbar-label { font-family: 'Cinzel', serif; font-size: 0.54rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-dim); white-space: nowrap; }
  .fb-btn { font-family: 'Cinzel', serif; font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 9px; border-radius: 2px; border: 1px solid var(--muted); background: transparent; color: var(--silver); cursor: pointer; transition: border-color 0.18s, color 0.18s, background 0.18s; white-space: nowrap; }
  .fb-btn:hover { border-color: var(--silver); color: var(--cream); }
  .fb-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(200,168,75,0.08); }
  .filterbar-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
  .filterbar-count { font-family: 'Cinzel', serif; font-size: 0.52rem; letter-spacing: 0.14em; color: var(--muted); width: 100%; text-align: center; }
  .no-results { text-align: center; padding: 2rem; font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--muted); font-size: 1.05rem; }

  /* SEARCH */
  .search-wrap { display: flex; align-items: center; gap: 0.5rem; }
  .search-input { background: transparent; border: 1px solid var(--muted); border-radius: 2px; color: var(--cream); font-family: 'Crimson Text', serif; font-size: 0.9rem; padding: 3px 8px; width: 160px; outline: none; transition: border-color 0.18s; }
  .search-input::placeholder { color: var(--muted); font-style: italic; }
  .search-input:focus { border-color: var(--gold-dim); }
  .search-clear { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0 2px; line-height: 1; display: none; }
  .search-clear.visible { display: block; }

  /* RESPONSIVE */
  @media (max-width: 680px) {
    .filterbar { gap: 0.4rem 0.8rem; padding: 0.5rem 0.8rem; }
    .filterbar-count { margin-left: 0; width: 100%; }
    .search-input { width: 120px; }
    .detail { grid-template-columns: 1fr; grid-template-rows: auto auto auto; padding: 1rem; }
    .detail-cover { grid-row: 1; grid-column: 1; margin-right: 0; margin-bottom: 1.2rem; display: flex; justify-content: center; }
    .detail-cover img { width: clamp(180px, 55vw, 260px); }
    .detail-meta { grid-row: 2; grid-column: 1; }
    .detail-contribs { grid-row: 3; grid-column: 1; }
    :root { --thumb-w: 58px; --thumb-h: 77px; }
  }
</style>
</head>
<body>
<canvas id="stars-canvas"></canvas>
<div class="page">
  <header>
    <div class="eyebrow">Jot in the Dark</div>
    <h1>Shawn M. Klimek</h1>
    <div class="sub">Author &amp; Poet — Speculative Fiction</div>
  </header>
  <div class="hint">Drag strip · Click any cover · ← → arrow keys</div>
  <div id="back-bar" style="display:none; text-align:center; padding: 0.5rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border);">

  </div>

  <div class="filterbar" id="filterBar">
    <div class="filterbar-group">
      <span class="filterbar-label">Genre</span>
      <button class="fb-btn active" data-filter="all">All</button>
      <button class="fb-btn" data-filter="Horror">Horror</button>
      <button class="fb-btn" data-filter="Sci-Fi">Sci-Fi</button>
      <button class="fb-btn" data-filter="Fantasy">Fantasy</button>
      <button class="fb-btn" data-filter="Poetry">Poetry</button>
      <button class="fb-btn" data-filter="Humor">Humor</button>
      <button class="fb-btn" data-filter="Crime">Crime</button>
      <button class="fb-btn" data-filter="Fiction">Fiction</button>
    </div>
    <div class="filterbar-sep"></div>
    <div class="filterbar-group">
      <span class="filterbar-label">Sort</span>
      <button class="fb-btn active" data-sort="year">Year ↓</button>
      <button class="fb-btn" data-sort="title">Title</button>
      <button class="fb-btn" data-sort="publisher">Publisher</button>
    </div>
    <div class="filterbar-sep"></div>
    <div class="filterbar-group search-wrap">
      <span class="filterbar-label">Search</span>
      <input class="search-input" id="searchInput" type="text" placeholder="title or story…" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
    </div>
    <span class="filterbar-count" id="filterCount"></span>
  </div>
  <div class="strip-outer" id="stripOuter">
    <button class="arrow-btn left" id="arrowLeft" aria-label="Previous">&#8249;</button>
    <button class="arrow-btn right" id="arrowRight" aria-label="Next">&#8250;</button>
    <div class="strip-track" id="stripTrack"></div>
  </div>
  <div class="detail" id="detailArea">
    <div class="detail-empty">Select a cover to explore</div>
  </div>
  <footer>
    <a href="https://jotinthedark.com">jotinthedark.com</a>
    &nbsp;·&nbsp; &copy; Shawn M. Klimek
    &nbsp;·&nbsp; <a href="https://jotinthedark.blogspot.com" target="_blank" rel="noopener">Blog</a>
  </footer>
</div>

// ── STARFIELD ──
(function(){
  const c = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){ c.width = innerWidth; c.height = innerHeight; }
  function make(n){ stars=[]; for(let i=0;i<n;i++) stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.1+0.2,a:Math.random()*0.75+0.2,sp:Math.random()*0.003+0.001,ph:Math.random()*Math.PI*2}); }
  function draw(t){ ctx.clearRect(0,0,c.width,c.height); for(const s of stars){ const a=s.a*(0.65+0.35*Math.sin(t*s.sp+s.ph)); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fillStyle=`rgba(200,200,230,${a})`; ctx.fill(); } requestAnimationFrame(draw); }
  resize(); make(280); window.addEventListener('resize',()=>{resize();make(280);}); requestAnimationFrame(draw);
})();

// ── FILTER/SORT ENGINE ──
let visibleBooks = [];
let activeFilter = 'all';
let activeSort   = 'year';
let searchQuery  = '';
const countEl     = document.getElementById('filterCount');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

function applyFilterSort() {
  const q = searchQuery.trim().toLowerCase();
  visibleBooks = books.filter(b => {
    if (activeFilter !== 'all' && !b.genres.includes(activeFilter)) return false;
    if (q) {
      const inTitle    = b.title.toLowerCase().includes(q);
      const inContribs = b.contributions.some(c => c.title.toLowerCase().includes(q));
      const inPub      = b.publisher.toLowerCase().includes(q);
      if (!inTitle && !inContribs && !inPub) return false;
    }
    return true;
  });
  visibleBooks = [...visibleBooks].sort((a,b) => {
    if (activeSort==='year')      return (parseInt(b.year)||0)-(parseInt(a.year)||0);
    if (activeSort==='title')     return a.title.localeCompare(b.title);
    if (activeSort==='publisher') return a.publisher.localeCompare(b.publisher);
    return 0;
  });
  const shown = visibleBooks.length, total = books.length;
  countEl.textContent = shown===total ? `${total} books` : `${shown} of ${total} books`;
  rebuildStrip();
}

function rebuildStrip() {
  track.innerHTML='';
  built=false; offset=0;
  track.style.transition='none';
  track.style.transform='translateX(0)';
  coverWrap=null; coverImg=null; metaDiv=null; contribDiv=null;

  if (visibleBooks.length===0) {
    detailArea.innerHTML='<div class="detail-empty">No books match this filter.</div>';
    return;
  }
  visibleBooks.forEach((book,i) => {
    const el=document.createElement('div'); el.className='thumb'; el.dataset.i=i;
    const img=document.createElement('img');
    img.src=COVERS_BASE+book.file; img.alt=book.title; img.loading='lazy';
    img.onerror=()=>{ img.remove(); const lbl=document.createElement('div'); lbl.className='placeholder-label'; lbl.textContent=book.title; el.appendChild(lbl); };
    el.appendChild(img);
    if (!book.available){ const badge=document.createElement('div'); badge.className='oop-badge'; badge.textContent='O.O.P.'; el.appendChild(badge); }
    el.addEventListener('click',()=>{ if(!dragged) goTo(i); });
    track.appendChild(el);
  });
  goTo(0,false);
}


// ── CAROUSEL ──
const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--thumb-w'))||96 + 10;
const GAP = 10;
let THUMB_W = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--thumb-w'))||96;

const track = document.getElementById('stripTrack');
const outer = document.getElementById('stripOuter');
const detailArea = document.getElementById('detailArea');

let offset = 0, activeIdx = 0, built = false;
let dragStart = null, dragStartOff = null, dragged = false, vel = 0, lastX = 0, lastT = 0, raf = null;

function getStep(){ return (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--thumb-w'))||96) + GAP; }


function applyOffset(o, anim) {
  track.style.transition = anim ? 'transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94)' : 'none';
  track.style.transform = `translateX(${o}px)`;
  offset = o;
}

function goTo(idx, anim=true) {
  if (!visibleBooks || visibleBooks.length===0) return;
  idx = Math.max(0, Math.min(visibleBooks.length-1, idx));
  const st = getStep();
  applyOffset(-idx * st, anim);
  setActive(idx);
}

function setActive(idx) {
  if (idx === activeIdx && built) return;
  activeIdx = idx;
  track.querySelectorAll('.thumb').forEach((t,i) => {
    t.classList.remove('active','near1','near2');
    const d = Math.abs(i-idx);
    if (d===0) t.classList.add('active');
    else if (d===1) t.classList.add('near1');
    else if (d===2) t.classList.add('near2');
  });
  renderDetail(visibleBooks[idx]);
  built = true;
}

// Drag
outer.addEventListener('mousedown', e => startDrag(e.clientX));
outer.addEventListener('touchstart', e => startDrag(e.touches[0].clientX), {passive:true});
function startDrag(x) {
  cancelRaf(); dragStart=x; dragStartOff=offset; dragged=false; vel=0; lastX=x; lastT=Date.now();
  track.style.transition='none'; outer.classList.add('dragging');
}
window.addEventListener('mousemove', e => onDrag(e.clientX));
window.addEventListener('touchmove', e => onDrag(e.touches[0].clientX), {passive:true});
function onDrag(x) {
  if (dragStart===null) return;
  const dx = x - dragStart;
  if (Math.abs(dx)>4) dragged=true;
  if (!dragged) return;
  const now=Date.now(), dt=now-lastT||1;
  vel = (x-lastX)/dt*16; lastX=x; lastT=now;
  const st=getStep(), min=-(visibleBooks.length-1)*st;
  let o = Math.max(min-60, Math.min(60, dragStartOff+dx));
  track.style.transform=`translateX(${o}px)`; offset=o;
  const li = Math.max(0,Math.min(visibleBooks.length-1, Math.round(-o/st)));
  if (li!==activeIdx) setActive(li);
}
window.addEventListener('mouseup', endDrag);
window.addEventListener('touchend', endDrag);
function endDrag() {
  if (dragStart===null) return;
  dragStart=null; outer.classList.remove('dragging');
  if (!dragged) return;
  momentum();
}
function momentum() {
  if (Math.abs(vel)<0.4){ snap(); return; }
  offset+=vel; vel*=0.88;
  const st=getStep(), min=-(visibleBooks.length-1)*st;
  offset=Math.max(min,Math.min(0,offset));
  track.style.transform=`translateX(${offset}px)`;
  const li=Math.max(0,Math.min(visibleBooks.length-1,Math.round(-offset/st)));
  if (li!==activeIdx) setActive(li);
  raf=requestAnimationFrame(momentum);
}
function cancelRaf(){ if(raf){cancelAnimationFrame(raf);raf=null;} }
function snap(){ cancelRaf(); goTo(Math.max(0,Math.min(visibleBooks.length-1,Math.round(-offset/getStep()))),true); }

document.getElementById('arrowLeft').addEventListener('click',()=>goTo(activeIdx-1));
document.getElementById('arrowRight').addEventListener('click',()=>goTo(activeIdx+1));
window.addEventListener('keydown',e=>{
  if (e.target===searchInput) return;
  if(e.key==='ArrowLeft'){e.preventDefault();goTo(activeIdx-1);}
  if(e.key==='ArrowRight'){e.preventDefault();goTo(activeIdx+1);}
});

// ── FILTER BUTTONS ──
document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilterSort();
  });
});

// ── SORT BUTTONS ──
document.querySelectorAll('[data-sort]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSort = btn.dataset.sort;
    applyFilterSort();
  });
});

// ── SEARCH ──
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  searchClear.classList.toggle('visible', searchQuery.length > 0);
  applyFilterSort();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.classList.remove('visible');
  applyFilterSort();
});

// ── DETAIL RENDERER ──
let coverWrap=null, coverImg=null, metaDiv=null, contribDiv=null;

function renderDetail(book) {
  if (!coverWrap) {
    detailArea.innerHTML='';
    coverWrap=document.createElement('div'); coverWrap.className='detail-cover';
    coverImg=document.createElement('img'); coverImg.id='dimg';
    coverImg.onerror=()=>{ coverImg.style.minHeight='180px'; coverImg.style.background='var(--panel)'; };
    coverWrap.appendChild(coverImg); detailArea.appendChild(coverWrap);
    metaDiv=document.createElement('div'); metaDiv.className='detail-meta'; detailArea.appendChild(metaDiv);
    contribDiv=document.createElement('div'); contribDiv.className='detail-contribs'; detailArea.appendChild(contribDiv);
  }
  coverWrap.classList.add('fade');
  setTimeout(()=>{ coverImg.src=COVERS_BASE+book.file; coverImg.alt=book.title; coverWrap.classList.remove('fade'); }, 180);

  const genres = book.genres.map(g=>`<span class="genre-tag">${g}</span>`).join('');
  let btn;
  if (book.available && book.purchaseUrl) btn=`<a class="btn-buy" href="${book.purchaseUrl}" target="_blank" rel="noopener">Purchase ↗</a>`;
  else if (book.available) btn=`<span class="btn-buy dim">Link Pending</span>`;
  else btn=`<span class="btn-buy dim">Out of Print</span>`;
  metaDiv.innerHTML=`<div class="book-title">${book.title}</div>
    <div class="meta-row">
      <div class="meta-item"><span class="meta-label">Publisher</span><span class="meta-val">${book.publisher}</span></div>
      <div class="meta-item"><span class="meta-label">Year</span><span class="meta-val">${book.year}</span></div>
    </div>
    <div>${genres}</div>${btn}`;

  const q = searchQuery.trim().toLowerCase();
  const items = book.contributions.map(c => {
    let title = c.title;
    if (q && title.toLowerCase().includes(q)) {
      const i = title.toLowerCase().indexOf(q);
      title = title.slice(0,i) + `<mark style="background:rgba(200,168,75,0.3);color:var(--cream);border-radius:2px;padding:0 2px">${title.slice(i,i+q.length)}</mark>` + title.slice(i+q.length);
    }
    return `<li><span class="contrib-type">${c.type}</span>${title}</li>`;
  }).join('');
  contribDiv.innerHTML=`<div class="contribs-label">Shawn M. Klimek — Contributions</div><ul class="contribs-list">${items}</ul>`;
}

// ── INIT ──
applyFilterSort();

// Read ?book= URL parameter and scroll to that entry
(function() {
  const params = new URLSearchParams(window.location.search);
  const bookId = params.get('book');
  if (!bookId) return;
  // Wait for applyFilterSort to populate visibleBooks
  const idx = visibleBooks.findIndex(b => b.id === bookId);
  if (idx !== -1) {
    goTo(idx, false);
  }
  // Show back link if referred from gallery
  const backLink = document.getElementById('back-bar');
  if (backLink) backLink.style.display = 'block';
})();

</script>
